services:
  mysql:
    image: mysql:8.0
    container_name: frilo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: frilo
      MYSQL_USER: frilo
      MYSQL_PASSWORD: frilo
      MYSQL_ROOT_PASSWORD: root
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - frilo

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: frilo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      FRONTEND_APP_URL: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: frilo
      DB_USERNAME: frilo
      DB_PASSWORD: frilo
      MAIL_MAILER: log
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:3001,localhost:3002,127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    entrypoint: ["/usr/local/bin/frilo-backend-entrypoint"]
    networks:
      - frilo

  nginx:
    image: nginx:1.27-alpine
    container_name: frilo-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frilo

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: frilo-frontend
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    entrypoint: ["/usr/local/bin/frilo-frontend-entrypoint"]
    ports:
      - "3000:3000"
    networks:
      - frilo

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:

networks:
  frilo:
