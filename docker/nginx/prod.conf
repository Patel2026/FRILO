upstream nextjs {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Laravel compiled assets (CSS/JS)
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Laravel storage (uploads, symlinked)
    location ^~ /storage/ {
        try_files $uri =404;
    }

    # Laravel backend : API + Sanctum + protected admin
    location ^~ /api/frilo/ {
        rewrite ^/api/frilo/(.*)$ /api/$1 break;
        try_files $uri /index.php?$query_string;
    }

    location = /frilo-console {
        include /etc/nginx/admin-allowlist.conf;
        auth_basic "FRILO administration";
        auth_basic_user_file /etc/nginx/admin.htpasswd;

        try_files $uri /index.php?$query_string;
    }

    location ^~ /frilo-console/ {
        include /etc/nginx/admin-allowlist.conf;
        auth_basic "FRILO administration";
        auth_basic_user_file /etc/nginx/admin.htpasswd;

        try_files $uri /index.php?$query_string;
    }

    location = /admin {
        include /etc/nginx/admin-allowlist.conf;
        auth_basic "FRILO administration";
        auth_basic_user_file /etc/nginx/admin.htpasswd;

        try_files $uri /index.php?$query_string;
    }

    location ^~ /admin/ {
        include /etc/nginx/admin-allowlist.conf;
        auth_basic "FRILO administration";
        auth_basic_user_file /etc/nginx/admin.htpasswd;

        try_files $uri /index.php?$query_string;
    }

    location ~ ^/(api|sanctum)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
    }

    # Next.js frontend (tout le reste)
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
