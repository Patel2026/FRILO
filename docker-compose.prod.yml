services:
  mysql:
    image: mysql:8.0
    container_name: frilo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: frilo
      MYSQL_USER: frilo
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - frilo

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: frilo-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://${SERVER_IP}
      FRONTEND_APP_URL: http://${SERVER_IP}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: frilo
      DB_USERNAME: frilo
      DB_PASSWORD: ${DB_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: ${SERVER_IP}
      CORS_ALLOWED_ORIGINS: http://${SERVER_IP}
      RUN_MIGRATIONS: "true"
    entrypoint: ["/usr/local/bin/frilo-backend-entrypoint"]
    networks:
      - frilo

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
    container_name: frilo-frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://nginx/api
      NEXT_PUBLIC_API_URL: http://${SERVER_IP}/api
    depends_on:
      - backend
    networks:
      - frilo

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: frilo-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frilo

volumes:
  mysql_data:

networks:
  frilo:
